<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,#1E2D4B 0%,#0A1526 100%)}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:24px}
  .brandmark{width:64px;height:64px;border-radius:16px;background:#fff;display:flex;align-items:center;
    justify-content:center;margin-bottom:6px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .brandmark img{width:46px;height:46px;object-fit:contain}
  h1{color:#fff;font-size:22px;font-weight:600;text-align:center}
  .sub{color:#9fb0d0;font-size:13.5px;margin:2px 0 22px;text-align:center}
  .choices{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
  .choice{display:flex;align-items:center;gap:15px;padding:17px 18px;border-radius:16px;border:none;
    cursor:pointer;font-family:inherit;text-align:left;transition:transform .12s;text-decoration:none;
    box-shadow:0 4px 18px rgba(0,0,0,.18)}
  .choice:active{transform:scale(.97)}
  .cimg{width:48px;height:48px;flex:none;border-radius:11px;background:#fff;display:flex;
    align-items:center;justify-content:center}
  .cimg img{width:36px;height:36px;object-fit:contain}
  .ctxt{color:#fff}
  .ct-name{font-size:17px;font-weight:600;line-height:1.1;display:block}
  .ct-sub{font-size:12px;font-weight:400;opacity:.9;margin-top:2px;display:block}
  .c-renov{background:linear-gradient(135deg,#F07800,#D26800)}
  .c-clean{background:linear-gradient(135deg,#00AAE7,#0090C4)}
  .chev{margin-left:auto;color:rgba(255,255,255,.7);font-size:20px;flex:none}
</style>
